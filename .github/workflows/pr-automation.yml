name: PR Automation

on:
  pull_request:
    types: [opened, synchronize, edited, reopened]

# 워크플로우 권한 설정 (PR 코멘트 작성 및 라벨 추가를 위해 필요)
permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

jobs:
  # PR 제목 규칙 검증 (Conventional Commits)
  validate-pr-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      checks: write
      issues: write
    steps:
      - name: Validate PR Title
        id: validate
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            perf
            style
            docs
            chore
            test
          scopes: |
            backend
            frontend
            config
            ci
          requireScope: false
          requireSubject: false
          subjectPattern: ^.*$
          subjectPatternError: |
            PR 제목의 subject 부분은 선택사항입니다.
          wip: true
        continue-on-error: true

      - name: Debug semantic PR outputs
        if: always()
        run: |
          echo "## 🔍 PR 제목 검증 디버그 정보" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**PR 제목**: \`${{ github.event.pull_request.title }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**검증 결과**: ${{ steps.validate.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**추출된 정보**:">> $GITHUB_STEP_SUMMARY
          echo "- Type: \`${{ steps.validate.outputs.type }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Scope: \`${{ steps.validate.outputs.scope }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Subject: \`${{ steps.validate.outputs.subject }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.validate.outcome }}" == "failure" ]; then
            echo "**에러 메시지**: ${{ steps.validate.outputs.error_message }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**허용된 타입**: feat, fix, refactor, perf, style, docs, chore, test" >> $GITHUB_STEP_SUMMARY

      - name: Post Validation Error Comment
        if: steps.validate.outcome == 'failure'
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## ❌ PR 제목 검증 실패

            현재 PR 제목: **`${{ github.event.pull_request.title }}`**

            ### 🔍 디버그 정보
            - **추출된 Type**: `${{ steps.validate.outputs.type || '(없음)' }}`
            - **추출된 Scope**: `${{ steps.validate.outputs.scope || '(없음)' }}`
            - **추출된 Subject**: `${{ steps.validate.outputs.subject || '(없음)' }}`
            - **에러 메시지**: `${{ steps.validate.outputs.error_message || '알 수 없음' }}`

            ### 문제점
            PR 제목이 [Conventional Commits](https://www.conventionalcommits.org/) 형식을 따르지 않습니다.

            ### 올바른 형식
            ```
            <type>: <subject>
            ```

            ### 사용 가능한 타입 (제목이 다음 중 하나로 시작해야 함)
            - `feat`: 새로운 기능 추가
            - `fix`: 버그 수정
            - `refactor`: 코드 리팩토링
            - `perf`: 성능 개선
            - `style`: 코드 스타일 변경
            - `docs`: 문서 수정
            - `chore`: 기타 작업
            - `test`: 테스트 추가/수정

            ### 예시
            - ✅ `feat: code-rabbit config 추가`
            - ✅ `fix: PR 자동화 워크플로우 권한 수정`
            - ✅ `refactor: 코드 구조 개선`
            - ✅ `feat(backend): 새로운 API 추가`
            - ❌ `code-rabbit config 추가` (타입 누락)

            ### 해결 방법
            PR 제목을 `<type>: <subject>` 형식으로 수정해주세요. 예: `feat: code-rabbit config 추가`

            > 💡 더 자세한 디버그 정보는 [워크플로우 실행 로그](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})의 "Debug semantic PR outputs" 스텝에서 확인할 수 있습니다.
          edit-mode: replace

  # PR 본문을 커밋 로그로 자동 생성 (PR 생성 시에만)
  auto-fill-pr-body:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    if: github.event.action == 'opened' && (github.event.pull_request.body == '' || contains(github.event.pull_request.body, '<!-- 커밋 로그가 자동으로 여기에 채워집니다 -->'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate PR Body from Commits
        id: generate-body
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          
          # 커밋 로그 가져오기
          COMMITS=$(git log --pretty=format:"- %s (%h)" ${BASE_SHA}..${HEAD_SHA} || echo "- 변경사항 없음")
          
          # PR 본문 생성
          PR_BODY="## 📝 변경 사항
          
          $COMMITS
          
          ## 🔍 변경 이유
          
          <!-- 이 PR을 만든 이유를 설명해주세요 -->
          
          ## ✅ 체크리스트
          
          - [ ] 코드가 정상적으로 빌드됩니다
          - [ ] 테스트가 통과합니다 (해당되는 경우)
          - [ ] 문서가 업데이트되었습니다 (해당되는 경우)
          - [ ] CodeRabbit 리뷰를 확인했습니다
          
          ## 🔗 관련 이슈
          
          <!-- 관련 이슈가 있다면 링크해주세요 -->
          Closes #"
          
          # 멀티라인 출력
          {
            echo 'body<<EOF'
            echo "$PR_BODY"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Update PR Body
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.generate-body.outputs.body }}
          edit-mode: replace

  # 변경 파일 기반 라벨 자동 추가
  auto-label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add Labels Based on Changes
        uses: actions/labeler@v6
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: .github/labeler.yml
          sync-labels: true

  # 자동 체크 코멘트 (테스트 누락 제안 - 필수는 아님)
  auto-check-comment:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Changed Files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            src/main/java/**
            src/test/java/**

      - name: Check for Missing Tests
        id: check-tests
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          
          # 변경된 Java 파일 목록 가져오기
          CHANGED_JAVA=$(git diff --name-only --diff-filter=ACMR ${BASE_SHA}..${HEAD_SHA} | grep 'src/main/java.*\.java$' || true)
          MISSING_TESTS=""
          
          if [ -n "$CHANGED_JAVA" ]; then
            for file in $CHANGED_JAVA; do
              # 파일이 실제로 존재하는지 확인
              if [ -f "$file" ]; then
                # 테스트 파일 경로 생성
                test_file=$(echo "$file" | sed 's|src/main/java|src/test/java|' | sed 's|\.java|Test.java|')
                if [ ! -f "$test_file" ]; then
                  # 클래스명만 추출 (패키지 경로 제거)
                  class_name=$(basename "$file" .java)
                  MISSING_TESTS="${MISSING_TESTS}- \`${class_name}\` 클래스\n"
                fi
              fi
            done
          fi
          
          if [ -n "$MISSING_TESTS" ]; then
            echo "has_missing_tests=true" >> $GITHUB_OUTPUT
            echo "missing_tests<<EOF" >> $GITHUB_OUTPUT
            echo -e "$MISSING_TESTS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "has_missing_tests=false" >> $GITHUB_OUTPUT
          fi

      - name: Post Check Comment
        if: steps.check-tests.outputs.has_missing_tests == 'true'
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## 💡 테스트 제안
            
            다음 클래스에 대한 테스트 코드를 추가하는 것을 고려해주세요 (선택사항):
            
            ${{ steps.check-tests.outputs.missing_tests }}
            
            > 참고: 이는 필수 사항이 아니며, 코드 품질 향상을 위한 제안입니다.
