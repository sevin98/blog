name: Build and Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: blog_local
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Remove gradle.properties Java home setting for CI
        run: |
          sed -i '/^org\.gradle\.java\.home=/d' gradle.properties || true

      - name: Build with Gradle
        env:
          SPRING_PROFILES_ACTIVE: local
        run: ./gradlew clean build --no-daemon

      - name: List build artifacts
        run: |
          echo "## 📦 빌드 결과" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ 빌드 성공" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if ls build/libs/*.jar 1> /dev/null 2>&1; then
            echo "📦 JAR 파일:" >> $GITHUB_STEP_SUMMARY
            ls -lh build/libs/*.jar >> $GITHUB_STEP_SUMMARY
          fi
          if ls build/libs/*.war 1> /dev/null 2>&1; then
            echo "📦 WAR 파일:" >> $GITHUB_STEP_SUMMARY
            ls -lh build/libs/*.war >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: build-artifacts
          path: |
            build/libs/*.jar
            build/libs/*.war
          retention-days: 1
