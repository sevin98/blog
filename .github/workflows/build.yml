name: Build and Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon

      - name: List build artifacts
        run: |
          echo "## 📦 빌드 결과" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ 빌드 성공" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if ls build/libs/*.jar 1> /dev/null 2>&1; then
            echo "📦 JAR 파일:" >> $GITHUB_STEP_SUMMARY
            ls -lh build/libs/*.jar >> $GITHUB_STEP_SUMMARY
          fi
          if ls build/libs/*.war 1> /dev/null 2>&1; then
            echo "📦 WAR 파일:" >> $GITHUB_STEP_SUMMARY
            ls -lh build/libs/*.war >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: build-artifacts
          path: build/libs/*.jar
          retention-days: 7
