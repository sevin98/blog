# ---------------------------------------------------------------- #
# AI 기본 설정 (언어 및 페르소나)
# ---------------------------------------------------------------- #

# AI가 응답할 때 사용할 기본 언어를 설정합니다. (예: ko-KR, en-US)
language: ko-KR
# AI의 페르소나와 응답 톤앤매너를 상세하게 지시합니다. 최대 250자까지 작성할 수 있습니다.
tone_instructions: >
  Spring Boot 백엔드 전문가로서 개발자 성장을 돕습니다. 교육적 개선 중심 리뷰, SpringBoot/JPA/Java 공식 문서 참고 권장, 짧고 위트있는 칭찬, 비판보다 개선 제안 우선.

# ---------------------------------------------------------------- #
# 코드 리뷰 기능 세부 설정
# ---------------------------------------------------------------- #
reviews:
  # 리뷰의 전반적인 스타일을 설정합니다. 'chill'은 비교적 덜 엄격하고 부드러운 톤을 의미합니다.
  profile: chill
  # CodeRabbit의 코멘트를 모두 `resolve`하면, 자동으로 Approve를 하는 기능입니다.
  request_changes_workflow: false
  # PR의 전체적인 변경 사항에 대한 고수준의 요약(summary)을 생성할지 여부입니다.
  high_level_summary: true
  # 변경된 각 파일에 대한 요약을 생성할지 여부입니다. 
  changed_files_summary: false
  # 코드의 실행 흐름을 보여주는 시퀀스 다이어그램을 생성할지 여부입니다.
  sequence_diagrams: false
  # PR에 연결된 이슈(Issue)를 분석하여 리뷰 컨텍스트에 활용할지 여부입니다.
  assess_linked_issues: true
  # 연관된 다른 이슈를 찾아서 링크할지 여부입니다.
  related_issues: false
  # 연관된 다른 PR을 찾아서 링크할지 여부입니다.
  related_prs: false
  # PR에 적절한 레이블(e.g., 'bug', 'enhancement')을 제안할지 여부입니다.
  suggested_labels: false
  # 제안된 레이블을 자동으로 PR에 적용할지 여부입니다.
  auto_apply_labels: false
  # 이 PR을 리뷰할 만한 적절한 동료 리뷰어를 추천할지 여부입니다.
  suggested_reviewers: false
  # 추천된 리뷰어를 자동으로 할당할지 여부입니다.
  auto_assign_reviewers: false
  # 리뷰 요약에 위트 있는 시(poem)를 포함할지 여부입니다.
  poem: true
  # 특정 파일 경로에 따라 다른 리뷰 지침을 적용합니다.
  path_instructions:
    - path: src/main/java/**
      # 최대 2,000자까지 작성 가능합니다.
      instructions: |
        1. Spring Boot, Java, JPA 팀 코드 컨벤션 및 공식 스타일 가이드를 우선적으로 반영하여, 가독성·안정성(예외 처리)·테스트/유지보수 용이성·성능 이슈 등을 검토해주세요.
        2. 최신 Spring Boot/Java 트렌드, JPA 사용 패턴, RESTful API 설계, 보안 고려사항, 문서화(Javadoc) 등도 함께 확인해 주세요.
        3. 각 리뷰 포인트별로 문제점과 대안, 장단점을 논리적으로 제시하고, 필요한 경우 예시 코드도 추가해 주세요.
        4. 리뷰가 너무 많아서 피로감을 줄 수 있으니, 꼭 필요한 부분에 집중해주고, 나머지는 캡션으로 설명해주세요.
        5. 리뷰 남겨주는 부분은 해당 라인 범위의 코멘트에 작성해주세요.
        6. 미작성한 테스트 코드 케이스가 있다면, 어떤 테스트가 필요한지 제안해주세요.
    - path: src/main/resources/**
      instructions: |
        1. application.yml 설정 파일의 구조와 가독성을 확인해주세요.
        2. 환경별 설정 분리(local, production)가 올바르게 되어 있는지 확인해주세요.
        3. 보안 관련 설정(DB 비밀번호, API 키 등)이 환경 변수로 관리되고 있는지 확인해주세요.
    - path: build.gradle
      instructions: |
        1. 의존성 버전 관리가 적절한지 확인해주세요.
        2. 불필요한 의존성이 없는지 확인해주세요.
        3. Spring Boot 버전과 Java 버전 호환성을 확인해주세요.
    - path: Dockerfile
      instructions: |
        1. 멀티 스테이지 빌드 사용 여부를 확인해주세요.
        2. 보안 베스트 프랙티스(최소 권한 사용자, 불필요한 패키지 제거 등)를 확인해주세요.
        3. 이미지 크기 최적화가 되어 있는지 확인해주세요.
    - path: compose.yaml
      instructions: |
        1. 서비스 간 의존성 설정이 올바른지 확인해주세요.
        2. 환경 변수 관리가 적절한지 확인해주세요.
        3. 볼륨 및 네트워크 설정이 적절한지 확인해주세요.

  # ---------------------------------------------------------------- #
  # 자동 리뷰 트리거 설정
  # ---------------------------------------------------------------- #
  auto_review:
    # PR이 생성됐을 때 자동으로 리뷰를 시작할지 여부입니다.
    # `@coderabbitai review`를 코멘트에 입력하면 리뷰를 시작합니다.
    enabled: true
    # 자동 리뷰를 활성화할 base 브랜치 목록입니다. 기본값은 default branch만 허용합니다.
    # develop 브랜치도 허용하도록 설정합니다.
    base_branches:
      - main
      - develop
    # 이미 리뷰가 진행된 PR에 새로운 커밋이 추가될 때, 변경된 부분에 대해서만 자동으로 리뷰를 진행할지 여부입니다.
    auto_incremental_review: true
  # 리뷰 상태 메시지를 표시할지 여부입니다. false로 설정하면 스킵 메시지를 숨깁니다.
  review_status: true

# ---------------------------------------------------------------- #
# 채팅 기능 설정
# ---------------------------------------------------------------- #
chat:
  # 사용자가 @coderabbitai 태그를 지정하지 않아도 자동으로 답글을 달 수 있도록 설정합니다.
  auto_reply: true

# ---------------------------------------------------------------- #
# CodeRabbit의 지식 기반(Knowledge Base) 설정
# ---------------------------------------------------------------- #
knowledge_base:
  # 웹 검색을 통해 최신 정보나 문서를 참조할 수 있도록 허용할지 여부입니다.
  web_search:
    enabled: true
  # 레포지토리 내의 특정 파일을 AI의 코드 스타일 가이드라인으로 사용하도록 설정합니다.
  code_guidelines:
    enabled: true
    filePatterns:
      - README.md
      - CHANGELOG.md
  # CodeRabbit이 대화나 리뷰를 통해 학습한 내용을 어디에 저장하고 참조할지 범위를 설정합니다. 'local'은 현재 레포지토리에 한정됨을 의미합니다.
  learnings:
    scope: local
  # 이슈 정보를 참조할 범위를 설정합니다.
  issues:
    scope: local
  # 풀 리퀘스트 정보를 참조할 범위를 설정합니다.
  pull_requests:
    scope: local
