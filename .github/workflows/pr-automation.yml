name: PR Automation

on:
  pull_request:
    types: [opened, synchronize, edited, reopened]

# 워크플로우 권한 설정 (PR 코멘트 작성 및 라벨 추가를 위해 필요)
permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

jobs:
  # PR 본문을 커밋 로그로 자동 생성 (PR 생성 시에만)
  auto-fill-pr-body:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    if: github.event.action == 'opened' && (github.event.pull_request.body == '' || contains(github.event.pull_request.body, '<!-- 커밋 로그가 자동으로 여기에 채워집니다 -->'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate PR Body from Commits
        id: generate-body
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          
          # 커밋 로그 가져오기
          COMMITS=$(git log --pretty=format:"- %s (%h)" ${BASE_SHA}..${HEAD_SHA} || echo "- 변경사항 없음")
          
          # PR 본문 생성
          PR_BODY="## 📝 변경 사항
          
          $COMMITS
          
          ## 🔍 변경 이유
          
          <!-- 이 PR을 만든 이유를 설명해주세요 -->
          
          ## ✅ 체크리스트
          
          - [ ] 코드가 정상적으로 빌드됩니다
          - [ ] 테스트가 통과합니다 (해당되는 경우)
          - [ ] 문서가 업데이트되었습니다 (해당되는 경우)
          - [ ] CodeRabbit 리뷰를 확인했습니다
          
          ## 🔗 관련 이슈
          
          <!-- 관련 이슈가 있다면 링크해주세요 -->
          Closes #"
          
          # 멀티라인 출력
          {
            echo 'body<<EOF'
            echo "$PR_BODY"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Update PR Body
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.generate-body.outputs.body }}
          edit-mode: replace

  # 변경 파일 기반 라벨 자동 추가
  auto-label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add Labels Based on Changes
        uses: actions/labeler@v6
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: .github/labeler.yml
          sync-labels: true

