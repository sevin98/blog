spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: read:user
            redirect-uri: ${APP_BASE_URL}/login/oauth2/code/github

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-days: 7
  admin:
    github-username: ${ADMIN_GITHUB_USERNAME}
  frontend-url: ${FRONTEND_URL}
  cookie:
    secure: true

logging:
  config: classpath:logback-spring.xml
