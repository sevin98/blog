version: 1
reviews:
  profile: "balanced"   # 리뷰 강도 선택 (fast / balanced / thorough)
  path_includes:
    - "src/**/*.java"
    - "src/**/*.tsx"
    - "src/**/*.ts"
  path_excludes:
    - "node_modules/**"
    - "dist/**"
    - "build/**"
    - "**/*Test.java"
    - "**/*.spec.ts"
    - "**/*.test.ts"
comments:
  max_comments: 20       # PR당 최대 코멘트 수 제한
  auto_approve: false    # 자동 승인 여부